<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- ① 헤더: 제목 + 오늘 날짜 -->
    <header class="header">
      <h1 class="title">📋 오늘의 할 일</h1>
      <span class="today" id="today"></span>
    </header>

    <!-- ②③ 진행률: 전체 막대 + 카테고리별 요약 (app.js가 숫자를 채움) -->
    <section class="progress" aria-label="진행률">
      <div class="progress-row">
        <div class="progress-bar" id="progressBar" role="progressbar" aria-label="전체 진행률"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <span class="progress-text" id="progressText">0/0 (0%)</span>
      </div>
      <ul class="progress-cats" id="progressCats"></ul>
      <p class="celebrate" id="celebrate" hidden>🎉 오늘 할 일 완료!</p>
    </section>

    <!-- ④ 입력 영역: 카테고리 선택 + 할 일 입력 + 추가 버튼 -->
    <form class="add-form" id="addForm" autocomplete="off">
      <select class="cat-select" id="catSelect" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <input class="add-input" id="addInput" type="text" maxlength="100"
             placeholder="할 일 입력 후 Enter" aria-label="할 일 내용"
             title="단축키: / 또는 N 키로 여기로 이동">
      <button class="add-btn" type="submit" aria-label="추가">+</button>
    </form>

    <!-- ⑤ 카테고리 필터 탭 -->
    <nav class="filters" id="filters" aria-label="카테고리 필터">
      <button class="filter" data-filter="all">전체</button>
      <button class="filter" data-filter="work">업무</button>
      <button class="filter" data-filter="personal">개인</button>
      <button class="filter" data-filter="study">공부</button>
    </nav>

    <!-- ⑥ 할 일 목록 (app.js가 채워 넣음) -->
    <ul class="todo-list" id="todoList"></ul>

    <!-- 할 일이 하나도 없을 때 보여줄 안내 (지금은 숨김) -->
    <p class="empty" id="emptyMsg" hidden>할 일을 추가해 보세요 ✍️</p>

    <!-- 삭제 후 되돌리기 안내 (5초간 표시) -->
    <div class="toast" id="toast" role="status" hidden>
      <span id="toastMsg">삭제됨</span>
      <button class="undo-btn" id="undoBtn">되돌리기</button>
    </div>

    <!-- ⑦ 하단 바 -->
    <footer class="footer">
      <span id="remaining">남은 일 0개</span>
      <button class="clear-btn" id="clearDone">완료 항목 지우기</button>
    </footer>

  </main>

  <!-- 동작 연결 -->
  <script src="app.js"></script>
</body>
</html>
